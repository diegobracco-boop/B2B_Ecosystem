<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root{
      --lila-1:#550fed; --lila-3:#976cf6; --lila-4:#a780ff; --lila-bg:#D8C7FF;
      --verde:#029687; --verde-bg:#ccf3ee54;
      --rojo:#fa503f;  --rojo-bg:#fff2f2;
      --ink:#1c1233; --muted:#6b6480; --line:#e7e2f7; --card:#ffffff; --page:#f6f4fc;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--page);color:var(--ink)}
    header{background:var(--lila-1);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.01em}
    header .sub{font-size:12px;opacity:.85}
    .filters{background:var(--lila-bg);padding:10px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .filters label{font-size:12px;color:var(--ink);font-weight:600;margin-right:4px}
    .filters select{padding:6px 10px;border-radius:8px;border:1px solid var(--lila-4);background:#fff;font-size:13px;font-weight:600;color:var(--ink)}
    .filters .lastupd{margin-left:auto;font-size:11px;color:var(--muted)}
    main{padding:20px 24px 60px;max-width:1200px;margin:0 auto}
    .sec-title{font-size:14px;font-weight:700;color:var(--ink);margin:24px 0 10px;display:flex;align-items:center;gap:8px}
    .sec-title .pill{background:var(--lila-bg);color:var(--lila-1);font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700}
    .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
    .kpi-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
    .kpi-card .label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
    .kpi-card .value{font-size:26px;font-weight:800;margin:6px 0 4px;color:var(--ink)}
    .kpi-card .deltas{display:flex;gap:10px;font-size:12px}
    .chip{padding:2px 8px;border-radius:20px;font-weight:700}
    .chip.pos{background:var(--verde-bg);color:var(--verde)}
    .chip.neg{background:var(--rojo-bg);color:var(--rojo)}
    .chip.flat{background:#eee;color:var(--muted)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
    .tabs{display:flex;gap:8px;margin-bottom:12px}
    .tab-btn{border:1px solid var(--lila-4);background:#fff;color:var(--lila-1);font-weight:700;font-size:12px;padding:6px 14px;border-radius:20px;cursor:pointer}
    .tab-btn.active{background:var(--lila-1);color:#fff;border-color:var(--lila-1)}
    canvas{max-height:280px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line)}
    th:first-child,td:first-child{text-align:left}
    th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase}
    tr:last-child td{border-bottom:none}
    .two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
    @media (max-width:800px){.two-col{grid-template-columns:1fr}}
    .hf-row{display:flex;gap:14px;margin-bottom:14px}
    .hf-box{flex:1;background:var(--page);border-radius:10px;padding:10px 14px}
    .hf-box .t{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
    .hf-box .v{font-size:18px;font-weight:800;margin-top:4px}
    .muted{color:var(--muted)}
    .empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}
    .week-flag{font-size:11px;color:var(--muted)}
    .wf-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media (max-width:800px){.wf-grid{grid-template-columns:1fr}}
    .wf-card canvas{max-height:220px}
    .wf-table{margin-top:10px;font-size:12px}
    .wf-table th,.wf-table td{padding:5px 8px}
  </style>
</head>
<body>

<header>
  <div>
    <h1>Country One Pager</h1>
    <div class="sub">Resumen contable + gerencial + pulso operativo, por LoB y país</div>
  </div>
</header>

<div class="filters">
  <label>País</label>
  <select id="selPais"></select>
  <label>LoB</label>
  <select id="selLob"></select>
  <span class="lastupd" id="lastUpd"></span>
</div>

<main id="main">
  <div class="empty">Cargando…</div>
</main>

<script>
var STATE = { pais: 'Brasil', lob: 'b2b2c', evoMetric: 'nr' };
var evoChart = null;
var _charts = {};
function destroyChart_(id) { if (_charts[id]) { _charts[id].destroy(); delete _charts[id]; } }

function boot() {
  google.script.run.withSuccessHandler(function (filters) {
    var selPais = document.getElementById('selPais');
    var selLob  = document.getElementById('selLob');
    filters.paises.forEach(function (p) {
      var o = document.createElement('option'); o.value = p; o.textContent = p;
      selPais.appendChild(o);
    });
    filters.lobs.forEach(function (l) {
      var o = document.createElement('option'); o.value = l.id; o.textContent = l.label;
      selLob.appendChild(o);
    });
    selPais.value = STATE.pais;
    selLob.value  = STATE.lob;
    selPais.onchange = function () { STATE.pais = selPais.value; load(); };
    selLob.onchange  = function () { STATE.lob  = selLob.value;  load(); };
    load();
  }).withFailureHandler(showError).getFilters();
}

function load() {
  document.getElementById('main').innerHTML = '<div class="empty">Cargando…</div>';
  google.script.run
    .withSuccessHandler(render)
    .withFailureHandler(showError)
    .getOnePagerData({ pais: STATE.pais, lob: STATE.lob });
}

function showError(err) {
  document.getElementById('main').innerHTML =
    '<div class="empty">Error al cargar datos: ' + (err && err.message ? err.message : err) + '</div>';
}

function fmtM(v) { return (v == null) ? '—' : '$' + (v / 1e6).toFixed(2) + 'M'; }
function fmtK(v) { return (v == null) ? '—' : (v / 1e3).toFixed(1) + 'K'; }
function fmtPct(v) { return (v == null) ? '—' : (v >= 0 ? '+' : '') + v.toFixed(1) + '%'; }
function chipClass(v) { return (v == null) ? 'flat' : (v >= 0 ? 'pos' : 'neg'); }

function render(data) {
  document.getElementById('lastUpd').textContent =
    data.pais + ' · ' + (data.lob === 'b2b2c' ? 'B2B2C' : 'B2B') + ' · generado ' + new Date().toLocaleString('es-AR');

  var html = '';
  html += renderKpis(data.evolucion);
  html += renderEvoSection(data.evolucion);
  html += renderWaterfallsSection(data.waterfalls);
  html += renderPartners(data.partners, data.lob);
  html += renderSemanal(data.semanal);
  document.getElementById('main').innerHTML = html;

  renderEvoChart(data.evolucion);
  wireEvoTabs(data.evolucion);
  drawWaterfall_('oc', data.waterfalls && data.waterfalls.oc, 'oc');
  drawWaterfall_('nr', data.waterfalls && data.waterfalls.nr, 'nr');
}

// ── KPIs ──────────────────────────────────────────────────────
function lastActualIdx_(metric) {
  for (var i = metric.actuals.length - 1; i >= 0; i--) {
    if (metric.actuals[i] != null) return i;
  }
  return -1;
}

function renderKpis(evo) {
  if (!evo) return '<div class="empty">Sin datos de evolución para este LoB/país.</div>';
  var cards = evo.metrics.map(function (m) {
    var idx = lastActualIdx_(m);
    if (idx < 0) return '';
    var a = m.actuals[idx], b = m.budget[idx], ly = m.lastYear[idx];
    var vsB  = (b  ? (a - b) / Math.abs(b)  * 100 : null);
    var vsLY = (ly ? (a - ly) / Math.abs(ly) * 100 : null);
    var period = evo.periods[idx];
    return '' +
      '<div class="kpi-card">' +
        '<div class="label">' + m.label + ' · ' + period + '</div>' +
        '<div class="value">' + fmtM(a) + '</div>' +
        '<div class="deltas">' +
          '<span class="chip ' + chipClass(vsB)  + '">vs Budget ' + fmtPct(vsB)  + '</span>' +
          '<span class="chip ' + chipClass(vsLY) + '">vs LY ' + fmtPct(vsLY) + '</span>' +
        '</div>' +
      '</div>';
  }).join('');
  return '<div class="sec-title">Headline KPIs <span class="pill">último mes cerrado</span></div><div class="kpi-row">' + cards + '</div>';
}

// ── Evolución (chart) ─────────────────────────────────────────
function renderEvoSection(evo) {
  if (!evo) return '';
  var tabs = evo.metrics.map(function (m) {
    return '<button class="tab-btn' + (m.id === STATE.evoMetric ? ' active' : '') + '" data-metric="' + m.id + '">' + m.label + '</button>';
  }).join('');
  return '' +
    '<div class="sec-title">Evolución mensual FY27 <span class="pill">actual vs budget vs LY</span></div>' +
    '<div class="card"><div class="tabs">' + tabs + '</div><canvas id="evoCanvas" height="90"></canvas></div>';
}

function wireEvoTabs(evo) {
  if (!evo) return;
  document.querySelectorAll('.tab-btn[data-metric]').forEach(function (btn) {
    btn.onclick = function () {
      STATE.evoMetric = btn.getAttribute('data-metric');
      document.querySelectorAll('.tab-btn[data-metric]').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      renderEvoChart(evo);
    };
  });
}

function renderEvoChart(evo) {
  if (!evo) return;
  var m = evo.metrics.filter(function (x) { return x.id === STATE.evoMetric; })[0];
  if (!m) return;
  var ctx = document.getElementById('evoCanvas').getContext('2d');
  if (evoChart) evoChart.destroy();
  evoChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: evo.periods,
      datasets: [
        { label: 'Actual',    data: m.actuals,  borderColor: '#550fed', backgroundColor: '#550fed', tension: .25, spanGaps: true },
        { label: 'Budget',    data: m.budget,   borderColor: '#976cf6', borderDash: [6, 4], tension: .25, spanGaps: true },
        { label: 'Last Year', data: m.lastYear, borderColor: '#a3a3a3', borderDash: [2, 3], tension: .25, spanGaps: true }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } },
      scales: { y: { ticks: { callback: function (v) { return '$' + (v / 1e6).toFixed(1) + 'M'; } } } }
    }
  });
}

// ── P&L Bridge: NR Bridge + OC Waterfall (Budget → Actuals+RR) ──
// Mismo criterio visual que Dashboard_B2B_WLs (_drawBrasilConceptWf_ / _wfTotalDeltaPlugin_):
// colores oficiales Despegar — Goal lila #976cf6, Baseline lila #550fed, delta +/- #10b132/#e06666.
function _normOcLabel_(raw) {
  return ((raw || '').toLowerCase().indexOf('outsourced') >= 0) ? 'Fee SaaS' : raw;
}

function renderWaterfallsSection(wf) {
  if (!wf || (!wf.oc && !wf.nr)) return '';
  return '' +
    '<div class="sec-title">P&amp;L Bridge <span class="pill">Budget → Actuals+RR</span></div>' +
    '<div class="wf-grid">' +
      '<div class="card wf-card"><div class="sec-title" style="margin-top:0">Net Revenue Bridge</div>' +
        '<canvas id="wfc-nr" height="110"></canvas><div class="wf-table" id="wft-nr"></div></div>' +
      '<div class="card wf-card"><div class="sec-title" style="margin-top:0">Operating Contribution Waterfall</div>' +
        '<canvas id="wfc-oc" height="110"></canvas><div class="wf-table" id="wft-oc"></div></div>' +
    '</div>';
}

function _wfTotalDeltaPlugin_(goalTotal, baseTotal) {
  return {
    id: 'wfTotalDelta',
    beforeLayout: function (chart) {
      var lay = chart.options.layout || (chart.options.layout = {});
      var pad = lay.padding;
      if (typeof pad !== 'object' || pad === null) { pad = { top: 0, right: 0, bottom: 0, left: 0 }; lay.padding = pad; }
      pad.top = Math.max(pad.top || 0, 34);
    },
    afterDatasetsDraw: function (chart) {
      var meta = chart.getDatasetMeta(0);
      if (!meta || !meta.data || !meta.data.length) return;
      var goalBar = meta.data[0], baseBar = meta.data[meta.data.length - 1];
      if (!goalBar || !baseBar) return;
      var ctx = chart.ctx;
      var delta = baseTotal - goalTotal;
      var color = delta >= 0 ? '#10b132' : '#e06666';
      var x1 = goalBar.x, x2 = baseBar.x;
      var arrowY = chart.chartArea.top - 14;

      ctx.save();
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1.5;
      var LEG_GAP = 18;
      var legY1 = Math.max(goalBar.y - LEG_GAP, arrowY);
      var legY2 = Math.max(baseBar.y - LEG_GAP, arrowY);
      ctx.setLineDash([3, 2]);
      ctx.beginPath(); ctx.moveTo(x1, arrowY); ctx.lineTo(x1, legY1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x2, arrowY); ctx.lineTo(x2, legY2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(x1, arrowY); ctx.lineTo(x2, arrowY); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x2, arrowY); ctx.lineTo(x2 - 8, arrowY - 4); ctx.lineTo(x2 - 8, arrowY + 4);
      ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x1, arrowY - 5); ctx.lineTo(x1, arrowY + 5); ctx.stroke();
      var label = (delta >= 0 ? '+' : '') + fmtM(delta);
      ctx.font = 'bold 10px -apple-system,sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText(label, (x1 + x2) / 2, arrowY - 5);
      ctx.restore();
    }
  };
}

function drawWaterfall_(chartId, wf, kind) {
  destroyChart_('wfc-' + chartId);
  var canvasEl = document.getElementById('wfc-' + chartId);
  var tblEl    = document.getElementById('wft-' + chartId);
  if (!canvasEl) return;

  var itemsKey = (kind === 'oc') ? 'concepts' : 'groups';
  var items    = wf && wf[itemsKey];
  if (!wf || !items || !items.length) {
    var wrap = canvasEl.parentNode;
    if (wrap) wrap.innerHTML = '<div class="muted" style="text-align:center;padding:24px">Sin datos por concepto</div>';
    return;
  }

  var goalTotal = wf.budTotal;
  var baseTotal = wf.baseTotal;
  var normFn    = (kind === 'oc') ? _normOcLabel_ : function (x) { return x; };
  var sorted    = items.slice().sort(function (a, b) { return Math.abs(b.deltaVsBud) - Math.abs(a.deltaVsBud); });

  var labels = ['Budget'].concat(sorted.map(function (c) { return normFn(c.label); })).concat(['Actuals+RR']);
  var floats = [], colors = [], deltas = [], run = goalTotal;
  floats.push([0, goalTotal]); colors.push('#976cf6'); deltas.push(goalTotal);
  sorted.forEach(function (c) {
    var dv = c.deltaVsBud, f = run, t = run + dv;
    floats.push([Math.min(f, t), Math.max(f, t)]);
    colors.push(dv >= 0 ? '#10b132' : '#e06666');
    deltas.push(dv); run = t;
  });
  floats.push([0, baseTotal]); colors.push('#550fed'); deltas.push(baseTotal);

  var ally = [goalTotal, baseTotal], tmp = goalTotal;
  sorted.forEach(function (c) { tmp += c.deltaVsBud; ally.push(tmp); });
  var yMin = Math.min.apply(null, ally), yMax = Math.max.apply(null, ally);
  var pad = (Math.abs(yMax - yMin) * 0.12) || (Math.abs(yMax) * 0.15) || 1;
  yMin -= pad; yMax += pad;

  _charts['wfc-' + chartId] = new Chart(canvasEl, {
    type: 'bar',
    data: { labels: labels, datasets: [{ data: floats, backgroundColor: colors, borderRadius: 3, borderSkipped: false }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: function (ctx) {
          var idx = ctx.dataIndex, val = deltas[idx];
          var isEnd = (idx === 0 || idx === labels.length - 1);
          if (isEnd) return ' ' + fmtM(val);
          var lines = [' Δ vs Budget: ' + fmtM(val)];
          var it = sorted[idx - 1];
          if (it && it.components && it.components.length > 1) {
            it.components.forEach(function (c) { lines.push('  · ' + c.label + ': ' + fmtM(c.deltaVsBud)); });
          }
          return lines;
        } } }
      },
      scales: {
        x: { grid: { color: 'rgba(0,0,0,.04)' }, ticks: { color: '#57606a', font: { size: 10 } } },
        y: { min: yMin, max: yMax, grid: { color: 'rgba(0,0,0,.06)' },
             ticks: { color: '#57606a', font: { size: 10 }, callback: function (v) { return fmtM(v); } } }
      }
    },
    plugins: [{
      id: 'wfLabels-' + chartId,
      afterDatasetsDraw: function (chart) {
        var ctx = chart.ctx;
        chart.data.datasets[0].data.forEach(function (raw, i) {
          var bar = chart.getDatasetMeta(0).data[i];
          var isEnd = (i === 0 || i === labels.length - 1);
          var val = deltas[i];
          if (!val && val !== 0) return;
          ctx.save();
          ctx.fillStyle = isEnd ? '#1c1233' : (val >= 0 ? '#10b132' : '#e06666');
          ctx.font = 'bold 10px -apple-system,sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(fmtM(val), bar.x, bar.y - 5);
          ctx.restore();
        });
      }
    }, _wfTotalDeltaPlugin_(goalTotal, baseTotal)]
  });

  if (!tblEl) return;
  var cols  = sorted.map(function (c) { return normFn(c.label); }).concat(['Total']);
  var dVals = sorted.map(function (c) { return c.deltaVsBud; }).concat([baseTotal - goalTotal]);
  var th = '<table><thead><tr><th></th>' + cols.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead>';
  var row = '<tbody><tr><td>Δ vs Budget</td>' + dVals.map(function (v) {
    var sign = (v == null) ? '' : (v >= 0 ? '+' : '-');
    return '<td><span class="chip ' + chipClass(v) + '">' + sign + fmtM(Math.abs(v)) + '</span></td>';
  }).join('') + '</tr></tbody></table>';
  tblEl.innerHTML = th + row;
}

// ── Partners / Hunting-Farming ──────────────────────────────────
function renderPartners(p, lob) {
  if (!p || !p.lastMonth) return '';
  var hf = '';
  if (lob === 'b2b2c' && p.hunting && p.farming) {
    hf = '' +
      '<div class="hf-row">' +
        '<div class="hf-box"><div class="t">Hunting NR (' + p.lastMonth + ')</div><div class="v">' + fmtM(p.hunting.nr) + '</div></div>' +
        '<div class="hf-box"><div class="t">Farming NR (' + p.lastMonth + ')</div><div class="v">' + fmtM(p.farming.nr) + '</div></div>' +
      '</div>';
  }
  var totalsRow = function (label, t) {
    if (!t) return '';
    return '<tr><td>' + label + '</td><td>' + fmtM(t.gb) + '</td><td>' + fmtM(t.nr) + '</td><td>' + fmtM(t.npv) + '</td></tr>';
  };
  var totalsTable = '' +
    '<table><thead><tr><th>' + p.lastMonth + '</th><th>Gross Bookings</th><th>Net Revenue</th><th>NPV</th></tr></thead><tbody>' +
    totalsRow('Actual', p.actual) + totalsRow('Budget', p.budget) + totalsRow('Last Year', p.lastYear) +
    '</tbody></table>';

  var partnersRows = (p.topPartners || []).map(function (row) {
    return '<tr><td>' + row.partner + '</td><td>' + fmtM(row.net_revenue) + '</td><td>' + fmtM(row.gross_bookings) + '</td></tr>';
  }).join('');
  var partnersTable = partnersRows ? '' +
    '<table><thead><tr><th>Partner</th><th>Net Revenue</th><th>Gross Bookings</th></tr></thead><tbody>' + partnersRows + '</tbody></table>'
    : '<div class="muted">Sin partners para este corte.</div>';

  return '' +
    '<div class="sec-title">Partners <span class="pill">P&amp;L Managerial · gestional</span></div>' +
    '<div class="two-col">' +
      '<div class="card">' + hf + totalsTable + '</div>' +
      '<div class="card"><div class="sec-title" style="margin-top:0">Top 10 partners por NR</div>' + partnersTable + '</div>' +
    '</div>';
}

// ── Pulso semanal ────────────────────────────────────────────
function renderSemanal(s) {
  if (!s || !s.row) return '';
  var row = s.row;
  var head = s.weekLabels.map(function (w) { return '<th>Sem. ' + w + '</th>'; }).join('');
  function metricRow(label, key, fmt) {
    var cells = row.weeks.map(function (w) { return '<td>' + fmt(w[key]) + '</td>'; }).join('');
    return '<tr><td>' + label + '</td>' + cells + '</tr>';
  }
  var vsl4w = row.vsL4W || {};
  var chips = ['gb', 'rev', 'fvm'].map(function (k) {
    var label = { gb: 'GB', rev: 'NR', fvm: 'FVM' }[k];
    return '<span class="chip ' + chipClass(vsl4w[k]) + '">' + label + ' vs L4W ' + fmtPct(vsl4w[k]) + '</span>';
  }).join(' ');

  return '' +
    '<div class="sec-title">Pulso semanal <span class="pill">Daily Dashboard</span></div>' +
    '<div class="card">' +
      '<div style="margin-bottom:10px">' + chips + '</div>' +
      '<table><thead><tr><th>Millones USD</th>' + head + '</tr></thead><tbody>' +
        metricRow('Gross Bookings', 'gb',  function(v){return fmtM(v*1e6);}) +
        metricRow('Net Revenue',    'rev', function(v){return fmtM(v*1e6);}) +
        metricRow('FVM',            'fvm', function(v){return fmtM(v*1e6);}) +
      '</tbody></table>' +
    '</div>';
}

boot();
</script>
</body>
</html>
